name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Android Gradle Wrapper
      run: |
        flutter create . --org com.elezzy.grocery --project-name ezzi_grocery --platforms=android

    - name: Analyze code
      run: flutter analyze

    - name: Build APK
      run: flutter build apk --split-per-abi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        
