name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # قبول تراخيص Android SDK تلقائياً
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # تنظيف وتنزيل الحزم
      - name: Get packages
        run: |
          flutter clean
          flutter pub get

      # بناء التطبيق مع خيار تجنب مشاكل خطوط الأيقونات
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # رفع ملف الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
