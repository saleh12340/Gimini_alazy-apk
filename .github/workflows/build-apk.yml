name: Build APK

on:
  push:
    branches:
      - main

jobs:
 build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17" # تمام كذا

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5' # ثبت اصدار ثابت افضل

      - run: flutter --version
      - run: flutter clean
      - run: flutter pub get
      
      # اضف هذا عشان نشوف الخطأ الحقي
      - name: Build APK with logs
        run: flutter build apk --release --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
