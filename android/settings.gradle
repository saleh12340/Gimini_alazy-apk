import java.util.Properties

pluginManagement {
    // Determine Flutter SDK path from local.properties or FLUTTER_ROOT environment variable (CI-friendly)
    def properties = new Properties()
    def localProperties = file("local.properties")
    if (localProperties.exists()) {
        localProperties.withInputStream { properties.load(it) }
    }
    def flutterSdkPath = properties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
    if (flutterSdkPath == null) {
        throw new GradleException("flutter.sdk not set in local.properties and FLUTTER_ROOT not found in environment")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'Gimini_alazy_apk'

// Include the Android app module which lives in android/app
include ':app'
project(':app').projectDir = file('android/app')
